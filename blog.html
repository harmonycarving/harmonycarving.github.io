    <style>
        /* ===== 全域樣式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-cream: #F5F2EB;
            --red-gugong: #9B1B30;
            --gold-dark: #8B6914;
            --brown-deep: #3E2723;
            --text-soft: #4A3A2B;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
            --border-radius-art: 40% 60% 30% 70% / 50% 40% 60% 50%;
        }
        html { scroll-behavior: smooth; }
        body { font-family: 'Noto Serif TC', 'Times New Roman', serif; background-color: var(--bg-cream); color: var(--brown-deep); line-height: 1.7; -webkit-font-smoothing: antialiased; }

        a { text-decoration: none; }

        /* ===== 導航欄 ===== */
        .navbar { padding: 16px 0; position: sticky; top: 0; background: rgba(245, 242, 235, 0.94); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid rgba(62, 39, 35, 0.08); }
        .nav-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; }
        #logo-text { font-size: clamp(1.3rem, 3vw, 2rem); font-weight: 700; color: var(--red-gugong); letter-spacing: 3px; line-height: 1.2; }
        #logo-text small { font-size: 0.5em; color: var(--gold-dark); font-weight: normal; letter-spacing: 1px; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 6px 20px; }
        .nav-links a { text-decoration: none; color: var(--brown-deep); font-size: clamp(0.9rem, 1.2vw, 1.05rem); font-weight: 500; position: relative; transition: color 0.3s; white-space: nowrap; }
        .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: var(--red-gugong); transition: width 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--red-gugong); }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

        /* ===== 頁面主視覺 ===== */
        .page-hero { margin-top: 4px; position: relative; clip-path: polygon(0% 0%, 100% 0%, 100% 88%, 92% 95%, 78% 90%, 60% 97%, 40% 91%, 22% 96%, 8% 92%, 0% 86%); background: var(--brown-deep); }
        .page-hero img { width: 100%; height: 50vh; min-height: 280px; object-fit: cover; display: block; opacity: 0.85; transition: transform 7s ease; }
        .page-hero img:hover { transform: scale(1.02); }
        .page-hero .overlay { position: absolute; bottom: 18%; left: 6%; color: white; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7); }
        .page-hero .overlay h1 { font-size: clamp(2.6rem, 6vw, 4.2rem); font-weight: 700; letter-spacing: 8px; line-height: 1.1; }
        .page-hero .overlay .sub { font-size: clamp(1rem, 1.8vw, 1.3rem); opacity: 0.9; letter-spacing: 4px; font-weight: 300; margin-top: 6px; }

        /* ===== 日常動態雙欄區塊 ===== */
        .dynamic-journal { padding: 60px 0 80px; }
        .journal-layout { display: grid; grid-template-columns: 1fr 500px; gap: 50px; align-items: start; }
        
        /* 左側引言與情境圖 */
        .intro-side { position: sticky; top: 100px; }
        .intro-side h2 { font-size: clamp(1.8rem, 3.5vw, 2.4rem); color: var(--red-gugong); letter-spacing: 4px; margin-bottom: 12px; }
        .intro-side .sub { font-size: 1.1rem; color: var(--gold-dark); letter-spacing: 2px; margin-bottom: 24px; }
        .intro-side p { font-size: 1.05rem; color: var(--text-soft); line-height: 1.9; margin-bottom: 30px; }
        .intro-side .organic-img { 
            width: 100%; 
            height: 380px; 
            object-fit: cover; 
            border-radius: var(--border-radius-art); 
            box-shadow: var(--shadow-soft); 
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.6s ease;
        }
        .intro-side .organic-img:hover { transform: scale(1.02); border-radius: 50% 40% 60% 50% / 40% 60% 30% 70%; }

        /* 右側 Facebook 動態牆 */
        .fb-side { display: flex; flex-direction: column; align-items: center; }
        .facebook-wrapper {
            background: white;
            border-radius: 20px;
            padding: 20px 10px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(139, 105, 20, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            transition: transform 0.4s ease;
        }
        .facebook-wrapper:hover { transform: translateY(-4px); box-shadow: 0 18px 36px rgba(0, 0, 0, 0.12); }
        .facebook-wrapper iframe { max-width: 100%; border: none; border-radius: 12px; }

        /* ===== 右下角懸浮聯絡區塊 ===== */
        .floating-contact { position: fixed; bottom: 28px; right: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 999; }
        .floating-contact a { display: flex; align-items: center; justify-content: center; transition: transform 0.25s ease; }
        .floating-contact a:hover { transform: scale(1.10); }
        .line-btn img { width: clamp(52px, 8vw, 68px); height: auto; display: block; filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.18)); border-radius: 50%; background: #fff; padding: 2px; }
        .phone-btn { background: var(--red-gugong); color: white; padding: 8px 16px; border-radius: 40px; font-size: clamp(0.85rem, 1.2vw, 1.05rem); font-weight: 600; letter-spacing: 1px; box-shadow: 0 4px 16px rgba(155, 27, 48, 0.35); border: 2px solid rgba(255, 255, 255, 0.5); transition: background 0.3s, transform 0.25s; white-space: nowrap; }
        .phone-btn:hover { background: #7a1526; transform: scale(1.04); }

        /* ===== 頁尾 ===== */
        .footer { background: #2c1f1a; color: rgba(255, 255, 255, 0.7); padding: 36px 0 28px; text-align: center; font-size: 0.9rem; letter-spacing: 1px; }
        .footer a { color: #d4a373; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        /* ===== 響應式 ===== */
        @media (max-width: 992px) {
            .journal-layout { grid-template-columns: 1fr; gap: 40px; }
            .intro-side { position: static; text-align: center; }
            .intro-side .organic-img { height: 300px; max-width: 600px; margin: 0 auto; }
            .fb-side { align-items: center; }
        }
        @media (max-width: 768px) {
            .nav-content { flex-direction: column; align-items: stretch; gap: 8px; }
            .logo-area { justify-content: center; }
            .nav-links { justify-content: center; gap: 4px 14px; }
            .page-hero img { height: 35vh; min-height: 220px; }
            .page-hero .overlay { bottom: 14%; left: 5%; }

            .line-btn img { width: 56px; }

            .page-hero { clip-path: polygon(0% 0%, 100% 0%, 100% 90%, 88% 96%, 72% 90%, 52% 98%, 32% 91%, 14% 97%, 4% 92%, 0% 88%); }
        }
        @media (max-width: 500px) {

            .intro-side h2 { font-size: 1.6rem; }
            .intro-side .organic-img { height: 220px; }
            .facebook-wrapper { padding: 12px 6px; border-radius: 12px; }
        }
