    <style>
        /* ===== 全域樣式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-cream: #F5F2EB;
            --red-gugong: #9B1B30;
            --gold-dark: #8B6914;
            --brown-deep: #3E2723;
            --text-soft: #4A3A2B;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
            --border-radius-art: 40% 60% 30% 70% / 50% 40% 60% 50%;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Serif TC', 'Times New Roman', serif;
            background-color: var(--bg-cream);
            color: var(--brown-deep);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        a {
            text-decoration: none;
        }

        /* ===== 導航欄 ===== */
        .navbar {
            padding: 16px 0;
            position: sticky;
            top: 0;
            background: rgba(245, 242, 235, 0.94);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(62, 39, 35, 0.08);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            flex-shrink: 0;
        }

        #logo-text {
            font-size: clamp(1.3rem, 3vw, 2rem);
            font-weight: 700;
            color: var(--red-gugong);
            letter-spacing: 3px;
            line-height: 1.2;
        }
        #logo-text small {
            font-size: 0.5em;
            color: var(--gold-dark);
            font-weight: normal;
            letter-spacing: 1px;
        }

        #logo-image {
            display: none;
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--brown-deep);
            font-size: clamp(0.9rem, 1.2vw, 1.05rem);
            font-weight: 500;
            position: relative;
            transition: color 0.3s;
            white-space: nowrap;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--red-gugong);
            transition: width 0.3s;
        }
        .nav-links a:hover {
            color: var(--red-gugong);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-links a.active {
            color: var(--red-gugong);
        }
        .nav-links a.active::after {
            width: 100%;
        }

        /* ===== 頁面標題區（精簡版 Hero） ===== */
        .page-header {
            padding: 40px 0 20px;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-cream) 0%, #ede8df 100%);
            border-bottom: 1px solid rgba(139, 105, 20, 0.08);
        }

        .page-header h1 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            color: var(--red-gugong);
            letter-spacing: 8px;
            margin-bottom: 4px;
        }

        .page-header .sub {
            font-size: clamp(0.95rem, 1.5vw, 1.2rem);
            color: var(--gold-dark);
            letter-spacing: 3px;
        }

        /* ===== Facebook 動態嵌入區（核心） ===== */
        .facebook-section {
            padding: 30px 0 50px;
        }

        .facebook-wrapper {
            background: white;
            border-radius: var(--border-radius-art);
            padding: 24px 20px 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(139, 105, 20, 0.08);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .facebook-wrapper:hover {
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.10);
        }

        /* 嵌入區上方的追蹤呼籲 */
        .fb-cta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            padding: 0 6px;
        }

        .fb-cta .cta-text {
            font-size: 0.95rem;
            color: var(--text-soft);
            letter-spacing: 1px;
        }

        .fb-cta .cta-text strong {
            color: var(--red-gugong);
        }

        .fb-cta .cta-btn {
            background: var(--red-gugong);
            color: white;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: background 0.3s, transform 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .fb-cta .cta-btn:hover {
            background: #7a1526;
            transform: scale(1.03);
        }

        .facebook-wrapper iframe {
            width: 100%;
            border: none;
            border-radius: 8px;
            display: block;
            min-height: 700px;
            height: 75vh;
        }

        /* ===== 右下角懸浮聯絡區塊 ===== */
        .floating-contact {
            position: fixed;
            bottom: 28px;
            right: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 999;
        }

        .floating-contact a {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease;
        }
        .floating-contact a:hover {
            transform: scale(1.10);
        }

        .line-btn img {
            width: clamp(52px, 8vw, 68px);
            height: auto;
            display: block;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.18));
            border-radius: 50%;
            background: #fff;
            padding: 2px;
        }

        .phone-btn {
            background: var(--red-gugong);
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: clamp(0.85rem, 1.2vw, 1.05rem);
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 16px rgba(155, 27, 48, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: background 0.3s, transform 0.25s;
            white-space: nowrap;
        }
        .phone-btn:hover {
            background: #7a1526;
            transform: scale(1.04);
        }

        /* ===== 頁尾 ===== */
        .footer {
            background: #2c1f1a;
            color: rgba(255, 255, 255, 0.7);
            padding: 36px 0 28px;
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .footer a {
            color: #d4a373;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== 響應式 ===== */
        @media (max-width: 768px) {
            .nav-content {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .logo-area {
                justify-content: center;
            }
            .nav-links {
                justify-content: center;
                gap: 4px 14px;
            }

            .fb-cta {
                flex-direction: column;
                text-align: center;
            }

            .facebook-wrapper {
                padding: 16px 12px 12px;
                border-radius: 30% 70% 40% 60% / 60% 40% 60% 40%;
            }

            .facebook-wrapper iframe {
                min-height: 500px;
                height: 60vh;
            }

            .floating-contact {
                bottom: 20px;
                right: 20px;
                gap: 8px;
            }
            .line-btn img {
                width: 56px;
            }
            .phone-btn {
                padding: 6px 14px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 500px) {
            .page-header {
                padding: 28px 0 16px;
            }

            .facebook-wrapper {
                padding: 12px 8px 8px;
                border-radius: 20% 60% 30% 70% / 50% 40% 60% 50%;
            }

            .facebook-wrapper iframe {
                min-height: 400px;
                height: 55vh;
            }

            .fb-cta .cta-btn {
                padding: 6px 18px;
                font-size: 0.85rem;
            }

            .floating-contact {
                bottom: 14px;
                right: 14px;
                gap: 6px;
            }
            .line-btn img {
                width: 48px;
            }
            .phone-btn {
                padding: 5px 12px;
                font-size: 0.8rem;
            }
            .nav-links a {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 380px) {
            .nav-links {
                gap: 2px 10px;
            }
            .nav-links a {
                font-size: 0.78rem;
            }
            .phone-btn {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
            .facebook-wrapper iframe {
                min-height: 320px;
                height: 50vh;
            }
        }
    </style>
</head>
