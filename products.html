<html lang="zh-Hant">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品櫥窗 | 聯和刻記 · 掌心木藝</title>

    <style>
        /* ===== 全域樣式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-cream: #F5F2EB;
            --red-gugong: #9B1B30;
            --gold-dark: #8B6914;
            --brown-deep: #3E2723;
            --text-soft: #4A3A2B;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
            --border-radius-art: 40% 60% 30% 70% / 50% 40% 60% 50%;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Serif TC', 'Times New Roman', serif;
            background-color: var(--bg-cream);
            color: var(--brown-deep);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        a {
            text-decoration: none;
        }

        /* ===== 導航欄 ===== */
        .navbar {
            padding: 16px 0;
            position: sticky;
            top: 0;
            background: rgba(245, 242, 235, 0.94);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(62, 39, 35, 0.08);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            flex-shrink: 0;
        }

        #logo-text {
            font-size: clamp(1.3rem, 3vw, 2rem);
            font-weight: 700;
            color: var(--red-gugong);
            letter-spacing: 3px;
            line-height: 1.2;
        }
        #logo-text small {
            font-size: 0.5em;
            color: var(--gold-dark);
            font-weight: normal;
            letter-spacing: 1px;
        }

        #logo-image {
            display: none;
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--brown-deep);
            font-size: clamp(0.9rem, 1.2vw, 1.05rem);
            font-weight: 500;
            position: relative;
            transition: color 0.3s;
            white-space: nowrap;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--red-gugong);
            transition: width 0.3s;
        }
        .nav-links a:hover {
            color: var(--red-gugong);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-links a.active {
            color: var(--red-gugong);
        }
        .nav-links a.active::after {
            width: 100%;
        }

        /* ===== 頁面主視覺 (Banner) - 終極簡潔版，無任何遮罩 ===== */
        .page-hero {
            margin-top: 4px;
            position: relative;
            background: #2c1f1a;
            overflow: hidden;
            min-height: 300px;
            /* 簡單的底部裝飾線，保留一點藝術感 */
            border-bottom: 8px solid var(--bg-cream);
        }

        .page-hero img {
            width: 100%;
            height: 55vh;
            min-height: 300px;
            object-fit: cover;
            display: block;
            opacity: 0.8;
            transition: transform 7s ease;
        }
        .page-hero img:hover {
            transform: scale(1.02);
        }

        /* --- 文字覆蓋層（永遠完整顯示） --- */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 6%;
            z-index: 2;
        }

        .hero-overlay .text {
            color: white;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            max-width: 700px;
        }

        .hero-overlay .text h1 {
            font-size: clamp(2.6rem, 6vw, 4.2rem);
            font-weight: 700;
            letter-spacing: 8px;
            line-height: 1.1;
        }

        .hero-overlay .text .sub {
            font-size: clamp(1rem, 1.8vw, 1.3rem);
            opacity: 0.9;
            letter-spacing: 4px;
            font-weight: 300;
            margin-top: 6px;
        }

        /* ===== 分類選單 - 繼承豆子的精神（圓潤有機感） ===== */
        .filter-section {
            padding: 30px 0 10px;
            text-align: center;
            background: var(--bg-cream);
            margin-top: -4px;
            position: relative;
            z-index: 3;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 14px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 24px;
            border-radius: 40px;
            border: 1.5px solid rgba(139, 105, 20, 0.2);
            font-size: 0.95rem;
            color: var(--brown-deep);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            font-family: inherit;
            backdrop-filter: blur(4px);
            /* 繼承豆子的不規則感，每個按鈕的圓角稍有不同 */
            border-radius: 30% 70% 50% 50% / 50% 40% 60% 50%;
        }

        .filter-btn:nth-child(odd) {
            border-radius: 50% 30% 70% 50% / 40% 60% 50% 50%;
        }

        .filter-btn:hover {
            background: var(--red-gugong);
            color: white;
            border-color: var(--red-gugong);
            transform: translateY(-2px) scale(1.02);
        }

        .filter-btn.active {
            background: var(--red-gugong);
            color: white;
            border-color: var(--red-gugong);
            box-shadow: 0 4px 12px rgba(155, 27, 48, 0.25);
        }

        /* ===== 瀑布流相簿 ===== */
        .gallery {
            padding: 20px 0 70px;
        }

        .gallery-grid {
            column-count: 4;
            column-gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: var(--border-radius-art);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: all 0.4s ease;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
        }

        .gallery-item:hover {
            transform: scale(1.01) translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
            border-radius: 30% 70% 40% 60% / 60% 40% 60% 40%;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        .gallery-item .caption {
            padding: 12px 16px 16px;
            font-size: 0.85rem;
            color: var(--text-soft);
            letter-spacing: 1px;
            border-top: 1px solid rgba(139, 105, 20, 0.1);
            background: rgba(255, 255, 255, 0.5);
        }

        .gallery-item .caption .tag {
            display: inline-block;
            background: var(--red-gugong);
            color: white;
            font-size: 0.65rem;
            padding: 1px 12px;
            border-radius: 30px;
            margin-right: 6px;
            letter-spacing: 0.5px;
        }

        /* ===== 右下角懸浮聯絡區塊 ===== */
        .floating-contact {
            position: fixed;
            bottom: 28px;
            right: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 999;
        }

        .floating-contact a {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease;
        }
        .floating-contact a:hover {
            transform: scale(1.10);
        }

        .line-btn img {
            width: clamp(52px, 8vw, 68px);
            height: auto;
            display: block;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.18));
            border-radius: 50%;
            background: #fff;
            padding: 2px;
        }

        .phone-btn {
            background: var(--red-gugong);
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: clamp(0.85rem, 1.2vw, 1.05rem);
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 16px rgba(155, 27, 48, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: background 0.3s, transform 0.25s;
            white-space: nowrap;
        }
        .phone-btn:hover {
            background: #7a1526;
            transform: scale(1.04);
        }

        /* ===== 頁尾 ===== */
        .footer {
            background: rgba(44, 31, 26, 0.92);
            backdrop-filter: blur(4px);
            color: rgba(255, 255, 255, 0.7);
            padding: 36px 0 28px;
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-top: 20px;
        }
        .footer a {
            color: #d4a373;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== 響應式調整 ===== */
        @media (max-width: 1024px) {
            .gallery-grid {
                column-count: 3;
                column-gap: 18px;
            }
        }

        @media (max-width: 768px) {
            .gallery-grid {
                column-count: 2;
                column-gap: 14px;
            }
            .page-hero img {
                height: 40vh;
                min-height: 240px;
            }
            .hero-overlay .text h1 {
                font-size: 2.4rem;
            }
            .floating-contact {
                bottom: 20px;
                right: 20px;
                gap: 8px;
            }
            .line-btn img {
                width: 56px;
            }
            .phone-btn {
                padding: 6px 14px;
                font-size: 0.9rem;
            }
            .nav-content {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .logo-area {
                justify-content: center;
            }
            .nav-links {
                justify-content: center;
                gap: 4px 14px;
            }
            .filter-btn {
                padding: 4px 16px;
                font-size: 0.85rem;
                border-radius: 30% 60% 40% 50% / 50% 30% 60% 40%;
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                column-count: 1;
                column-gap: 0;
                max-width: 400px;
                margin: 0 auto;
            }
            .gallery-item {
                border-radius: 30% 70% 40% 60% / 60% 40% 60% 40%;
            }
            .page-hero img {
                height: 32vh;
                min-height: 180px;
            }
            .page-hero {
                min-height: 180px;
                border-bottom-width: 4px;
            }
            .hero-overlay .text h1 {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }
            .hero-overlay .text .sub {
                font-size: 0.8rem;
                letter-spacing: 2px;
            }
            .floating-contact {
                bottom: 14px;
                right: 14px;
                gap: 6px;
            }
            .line-btn img {
                width: 48px;
            }
            .phone-btn {
                padding: 5px 12px;
                font-size: 0.8rem;
            }
            .nav-links a {
                font-size: 0.85rem;
            }
            .filter-btn {
                padding: 3px 12px;
                font-size: 0.8rem;
            }
            .filter-section {
                padding: 16px 0 6px;
            }
        }

        @media (max-width: 380px) {
            .nav-links {
                gap: 2px 10px;
            }
            .nav-links a {
                font-size: 0.78rem;
            }
            .phone-btn {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
            .hero-overlay .text h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 右下角懸浮聯絡區塊 ===== -->

        <a href="tel:+886911938978" class="phone-btn">📞 0911938978</a>

    <!-- ===== 頁尾 ===== -->

            <p style="margin-top: 6px; font-size: 0.8rem;">

            </p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('作品櫥窗已載入，分類篩選功能正常運作。');

            // ===== 分類篩選功能 =====
            const filterButtons = document.querySelectorAll('.filter-btn');
            const galleryItems = document.querySelectorAll('.gallery-item');

            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');

                    const filterValue = this.getAttribute('data-filter');

                    galleryItems.forEach(item => {
                        const category = item.getAttribute('data-category');
                        if (filterValue === 'all' || category === filterValue) {
                            item.style.display = 'block';
                        } else {
                            item.style.display = 'none';
                        }
                    });
                });
            });
        });
    </script>
